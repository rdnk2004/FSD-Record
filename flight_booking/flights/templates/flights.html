<!DOCTYPE html>
<html>
<head>
    <title>Flight Booking System</title>
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f6f8;
        margin: 40px;
    }

    h1 {
        text-align: center;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background-color: white;
    }

    th, td {
        padding: 12px;
        border: 1px solid #ddd;
        text-align: center;
    }

    th {
        background-color: #333;
        color: white;
    }

    tr:hover {
        background-color: #f1f1f1;
    }
</style>
<body>

    <h1>Available Flights</h1>

    <table>
        <thead>
            <tr>
                <th>Flight Number</th>
                <th>Airline</th>
                <th>Departure</th>
                <th>Arrival</th>
                <th>Date</th>
                <th>Time</th>
                <th>Price</th>
                <th>Seats</th>
            </tr>
        </thead>

        <tbody>

            {% for flight in flights %}
            <tr>
                <td>{{ flight.flight_number }}</td>
                <td>{{ flight.airline }}</td>
                <td>{{ flight.departure }}</td>
                <td>{{ flight.arrival }}</td>
                <td>{{ flight.date }}</td>
                <td>{{ flight.time }}</td>
                <td>{{ flight.price }}</td>
                <td>{{ flight.seats }}</td>
            </tr>
            {% endfor %}

        </tbody>
    </table>

</body>
</html>
