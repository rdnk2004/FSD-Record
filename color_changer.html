<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Color Changer</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 420px;
            width: 100%;
        }
        #heading {
            font-size: 32px;
            margin-top: 0;
            margin-bottom: 25px;
            color: #1f2937;
            transition: color 0.3s ease;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            padding: 10px 18px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: #ffffff;
            transition: transform 0.1s, opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        button:active {
            transform: scale(0.95);
        }
        .btn-red { background: #ef4444; }
        .btn-blue { background: #3b82f6; }
        .btn-green { background: #10b981; }
        .btn-black { background: #111827; }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="heading">Change My Color!</h1>
        <div class="btn-group">
            <button class="btn-red" onclick="changeColor('#ef4444')">Red</button>
            <button class="btn-blue" onclick="changeColor('#3b82f6')">Blue</button>
            <button class="btn-green" onclick="changeColor('#10b981')">Green</button>
            <button class="btn-black" onclick="changeColor('#111827')">Black</button>
        </div>
    </div>

    <script>
        function changeColor(color) {
            document.getElementById('heading').style.color = color;
        }
    </script>
</body>
</html>
