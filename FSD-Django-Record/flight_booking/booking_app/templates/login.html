{% extends 'base.html' %}

{% block title %}Login | Flight Management System{% endblock %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 2rem auto;">
    <h2 style="text-align: center; margin-bottom: 1.5rem; color: var(--primary);">User Login</h2>
    <form method="POST" action="{% url 'login_user' %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" class="form-control" required placeholder="Enter username">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" class="form-control" required placeholder="Enter password">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Login</button>
    </form>
    <p style="margin-top: 1rem; text-align: center; font-size: 0.9rem;">
        Don't have an account? <a href="{% url 'register_user' %}" style="color: var(--primary); font-weight: 600;">Register here</a>
    </p>
</div>
{% endblock %}
