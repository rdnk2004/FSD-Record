<!DOCTYPE html>
<html>
<head>
    <title>Manage Employees</title>
    <style>
        body { font-family: Arial; margin: 30px; background: #f4f4f4; }
        .container { width: 70%; margin: auto; background: white; padding: 20px; border-radius: 5px; }
        .nav a { text-decoration: none; padding: 6px 12px; background: #007bff; color: white; border-radius: 3px; margin-right: 5px; }
        input, select { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; padding: 8px 15px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
        th { background: #007bff; color: white; }
        .edit { background: #ffc107; color: black; padding: 4px 8px; text-decoration: none; border-radius: 3px; }
        .delete { background: #dc3545; color: white; padding: 4px 8px; text-decoration: none; border-radius: 3px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Manage Employees</h2>
    <div class="nav">
        <a href="/">Home</a><a href="/departments/">Departments</a>
    </div><hr>
    <form method="POST" action="{% if employee %}{% url 'edit_employee' employee.id %}{% else %}{% url 'employees' %}{% endif %}">
        {% csrf_token %}
        <label>Employee Name</label>
        <input type="text" name="name" value="{{ employee.name|default:'' }}" required>
        <label>Employee ID</label>
        <input type="text" name="emp_id" value="{{ employee.emp_id|default:'' }}" required>
        <label>Email</label>
        <input type="email" name="email" value="{{ employee.email|default:'' }}" required>
        <label>Department</label>
        <select name="department" required>
            <option value="">-- Select Department --</option>
            {% for d in departments %}
            <option value="{{ d.id }}" {% if employee.department.id == d.id %}selected{% endif %}>{{ d.name }}</option>
            {% endfor %}
        </select>
        <label>Salary</label>
        <input type="number" step="0.01" name="salary" value="{{ employee.salary|default:'' }}" required>
        <button type="submit">{% if employee %}Update Employee{% else %}Add Employee{% endif %}</button>
    </form>
    <hr>
    <h3>Existing Employees</h3>
    <table>
        <tr><th>ID</th><th>Name</th><th>Email</th><th>Department</th><th>Salary</th><th>Action</th></tr>
        {% for e in employees %}
        <tr>
            <td>{{ e.emp_id }}</td><td>{{ e.name }}</td><td>{{ e.email }}</td><td>{{ e.department.name }}</td><td>${{ e.salary }}</td>
            <td>
                <a class="edit" href="{% url 'edit_employee' e.id %}">Edit</a>
                <a class="delete" href="{% url 'delete_employee' e.id %}" onclick="return confirm('Delete employee?')">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="6">No employees available.</td></tr>
        {% endfor %}
    </table>
</div>
</body>
</html>
