<!DOCTYPE html>
<html>
<head>
    <title>Employee Management</title>
    <style>
        body { font-family: Arial; margin: 30px; background: #f4f4f4; }
        .nav a { text-decoration: none; padding: 6px 12px; background: #007bff; color: white; border-radius: 3px; margin-right: 5px; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 15px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
        th { background: #007bff; color: white; }
    </style>
</head>
<body>
    <h2>Employee Management System</h2>
    <div class="nav">
        <a href="/">Home</a>
        <a href="/employees/">Employees</a>
        <a href="/departments/">Departments</a>
    </div>
    <hr>
    <form method="GET">
        Search Employee: <input type="text" name="search" value="{{ request.GET.search|default:'' }}">
        <button type="submit">Search</button>
    </form>
    <form method="GET">
        Department:
        <select name="department">
            <option value="">All Departments</option>
            {% for d in departments %}
            <option value="{{ d.id }}" {% if request.GET.department == d.id|stringformat:"i" %}selected{% endif %}>{{ d.name }}</option>
            {% endfor %}
        </select>
        <button type="submit">Filter</button>
    </form>
    <table>
        <tr><th>Emp ID</th><th>Name</th><th>Email</th><th>Department</th><th>Salary</th></tr>
        {% for e in employees %}
        <tr>
            <td>{{ e.emp_id }}</td><td>{{ e.name }}</td><td>{{ e.email }}</td><td>{{ e.department.name }}</td><td>${{ e.salary }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="5">No employees found.</td></tr>
        {% endfor %}
    </table>
</body>
</html>
