<!DOCTYPE html>
<html>
<head>
    <title>Student Management</title>
    <style>
        body { font-family: Arial; margin: 30px; background: #f4f4f4; }
        .container { width: 70%; margin: auto; background: white; padding: 20px; border-radius: 5px; }
        .nav a { text-decoration: none; padding: 6px 12px; background: #007bff; color: white; border-radius: 3px; margin-right: 5px; }
        input { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; padding: 8px 15px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
        th { background: #007bff; color: white; }
        .edit { background: #ffc107; color: black; padding: 4px 8px; text-decoration: none; border-radius: 3px; }
        .delete { background: #dc3545; color: white; padding: 4px 8px; text-decoration: none; border-radius: 3px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Student Management</h2>
    <div class="nav">
        <a href="/">Home</a><a href="/courses/">Courses</a><a href="/enrollment/">Enrollments</a>
    </div><hr>
    <form method="POST" action="{% if student %}{% url 'edit_student' student.id %}{% else %}{% url 'students' %}{% endif %}">
        {% csrf_token %}
        <label>Student Name</label>
        <input type="text" name="name" value="{{ student.name|default:'' }}" required>
        <label>Roll Number</label>
        <input type="text" name="roll" value="{{ student.roll_number|default:'' }}" required>
        <label>Email</label>
        <input type="email" name="email" value="{{ student.email|default:'' }}" required>
        <button type="submit">{% if student %}Update Student{% else %}Add Student{% endif %}</button>
    </form>
    <hr>
    <h3>Existing Students</h3>
    <table>
        <tr><th>Name</th><th>Roll No</th><th>Email</th><th>Action</th></tr>
        {% for s in students %}
        <tr>
            <td>{{ s.name }}</td><td>{{ s.roll_number }}</td><td>{{ s.email }}</td>
            <td>
                <a class="edit" href="{% url 'edit_student' s.id %}">Edit</a>
                <a class="delete" href="{% url 'delete_student' s.id %}" onclick="return confirm('Delete student?')">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="4">No students available.</td></tr>
        {% endfor %}
    </table>
</div>
</body>
</html>
