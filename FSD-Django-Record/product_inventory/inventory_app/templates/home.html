<!DOCTYPE html>
<html>
<head>
    <title>Product Inventory</title>
    <style>
        body { font-family: Arial; margin: 30px; background: #f4f4f4; }
        .nav a { text-decoration: none; padding: 6px 12px; background: #007bff; color: white; border-radius: 3px; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 15px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
        th { background: #007bff; color: white; }
    </style>
</head>
<body>
    <h2>Product Inventory System</h2>
    <div class="nav">
        <a href="/">Home</a>
        <a href="/add/">Add Product</a>
    </div>
    <hr>
    <form method="GET">
        Search: <input type="text" name="search" value="{{ request.GET.search|default:'' }}">
        <button type="submit">Search</button>
    </form>
    <form method="GET">
        Category: 
        <select name="category">
            <option value="">All Categories</option>
            {% for c in categories %}
            <option value="{{ c.id }}" {% if request.GET.category == c.id|stringformat:"i" %}selected{% endif %}>{{ c.name }}</option>
            {% endfor %}
        </select>
        <button type="submit">Filter</button>
    </form>
    <table>
        <tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Action</th></tr>
        {% for p in products %}
        <tr>
            <td>{{ p.name }}</td><td>{{ p.category.name }}</td><td>${{ p.price }}</td><td>{{ p.stock }}</td>
            <td><a href="{% url 'edit_product' p.id %}">Update</a></td>
        </tr>
        {% empty %}
        <tr><td colspan="5">No products found.</td></tr>
        {% endfor %}
    </table>
</body>
</html>
