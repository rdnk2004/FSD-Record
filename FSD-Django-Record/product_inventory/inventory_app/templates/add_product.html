<!DOCTYPE html>
<html>
<head>
    <title>Add Product</title>
    <style>
        body { font-family: Arial; margin: 30px; background: #f4f4f4; }
        .container { width: 70%; margin: auto; background: white; padding: 20px; border-radius: 5px; }
        input, select { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; padding: 8px 15px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
        th { background: #007bff; color: white; }
        .edit { background: #ffc107; color: black; padding: 4px 8px; text-decoration: none; border-radius: 3px; }
        .delete { background: #dc3545; color: white; padding: 4px 8px; text-decoration: none; border-radius: 3px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Add / Update Product</h2>
    <a href="/">Home</a><hr>
    <form method="POST" action="{% if product %}{% url 'edit_product' product.id %}{% else %}{% url 'add_product' %}{% endif %}">
        {% csrf_token %}
        <label>Product Name</label>
        <input type="text" name="name" value="{{ product.name|default:'' }}" required>
        <label>Category</label>
        <select name="category" required>
            <option value="">-- Select Category --</option>
            {% for c in categories %}
            <option value="{{ c.id }}" {% if product.category.id == c.id %}selected{% endif %}>{{ c.name }}</option>
            {% endfor %}
        </select>
        <label>Price</label>
        <input type="number" step="0.01" name="price" value="{{ product.price|default:'' }}" required>
        <label>Stock</label>
        <input type="number" name="stock" value="{{ product.stock|default:'' }}" required>
        <button type="submit">{% if product %}Update Product{% else %}Add Product{% endif %}</button>
    </form>
    <hr>
    <h3>Existing Products</h3>
    <table>
        <tr><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Action</th></tr>
        {% for p in products %}
        <tr>
            <td>{{ p.name }}</td><td>{{ p.category.name }}</td><td>${{ p.price }}</td><td>{{ p.stock }}</td>
            <td>
                <a class="edit" href="{% url 'edit_product' p.id %}">Edit</a>
                <a class="delete" href="{% url 'delete_product' p.id %}" onclick="return confirm('Delete product?')">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="5">No products available.</td></tr>
        {% endfor %}
    </table>
</div>
</body>
</html>
