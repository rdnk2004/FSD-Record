<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Size Changer</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 420px;
            width: 100%;
        }
        p {
            font-size: 16px;
            color: #374151;
            line-height: 1.6;
            margin-top: 0;
            margin-bottom: 25px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: font-size 0.2s ease;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            padding: 10px 18px;
            font-size: 15px;
            font-weight: 600;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            cursor: pointer;
            background: #ffffff;
            color: #374151;
            transition: all 0.2s;
        }
        button:hover {
            background: #f9fafb;
            border-color: #9ca3af;
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="margin-top: 0; margin-bottom: 15px; color: #111827;">Font Size Changer</h2>
        <p id="text-para">This is a sample paragraph. You can dynamically adjust its font size by clicking the buttons below.</p>
        <div class="btn-group">
            <button onclick="setSize('12px')">Small</button>
            <button onclick="setSize('18px')">Medium</button>
            <button onclick="setSize('24px')">Large</button>
        </div>
    </div>

    <script>
        function setSize(size) {
            document.getElementById('text-para').style.fontSize = size;
        }
    </script>
</body>
</html>
