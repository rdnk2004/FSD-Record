<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Switcher</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 18px;
            font-size: 15px;
            font-weight: 600;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            cursor: pointer;
            background: #ffffff;
            color: #374151;
            transition: all 0.2s;
        }
        button:hover {
            background: #f9fafb;
            border-color: #9ca3af;
        }
        button.active {
            background: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
        }
        .img-container {
            width: 100%;
            height: 250px;
            border-radius: 8px;
            overflow: hidden;
            background: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #e5e7eb;
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="margin-top: 0; margin-bottom: 20px; color: #111827;">Image Switcher</h2>
        <div class="btn-group">
            <button onclick="switchImage('images/nature.png', this)">Nature</button>
            <button onclick="switchImage('images/flower.png', this)">Flower</button>
            <button onclick="switchImage('images/animal.png', this)">Animal</button>
        </div>
        <div class="img-container">
            <span id="placeholder" style="color: #6b7280;">Select a category to display the image</span>
            <img id="display-img" src="" alt="Selected Category">
        </div>
    </div>

    <script>
        function switchImage(src, btn) {
            const img = document.getElementById('display-img');
            const placeholder = document.getElementById('placeholder');
            
            img.src = src;
            img.style.display = 'block';
            placeholder.style.display = 'none';

            const buttons = document.querySelectorAll('.btn-group button');
            buttons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>
</body>
</html>
