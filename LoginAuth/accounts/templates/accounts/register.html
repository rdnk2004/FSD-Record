<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .card {
            max-width: 440px;
            margin: 40px auto;
            background: #ffffff;
            padding: 25px 30px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
            margin-bottom: 20px;
        }
        form p {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 14px;
            color: #444;
            font-weight: bold;
            margin-bottom: 4px;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus {
            border-color: #007bff;
            outline: none;
        }
        .helptext {
            display: block;
            font-size: 12px;
            color: #777;
            margin-top: 4px;
            line-height: 1.4;
        }
        ul.errorlist {
            color: #c81e1e;
            font-size: 13px;
            padding-left: 18px;
            margin: 5px 0;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #218838;
        }
        .footer-text {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            color: #666;
        }
        .footer-text a {
            color: #007bff;
            text-decoration: none;
        }
        .footer-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Register</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Register</button>
        </form>
        <p class="footer-text">Already have an account? <a href="{% url 'login' %}">Login here</a></p>
    </div>
</body>
</html>
