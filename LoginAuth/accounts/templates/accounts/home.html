<!DOCTYPE html>
<html>
<head>
    <title>Home</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .card {
            max-width: 480px;
            margin: 80px auto;
            background: #ffffff;
            padding: 35px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        h2 {
            color: #333;
            margin-top: 0;
        }
        p {
            color: #555;
            font-size: 15px;
            line-height: 1.5;
        }
        .username {
            color: #007bff;
            font-weight: bold;
        }
        .btn-logout {
            display: inline-block;
            margin-top: 15px;
            padding: 9px 20px;
            background-color: #dc3545;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
        }
        .btn-logout:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Welcome, <span class="username">{{ request.user.username }}</span>!</h2>
        <p>You have successfully logged in to your account.</p>
        <a href="{% url 'logout' %}" class="btn-logout">Logout</a>
    </div>
</body>
</html>
