<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - WebDevCon 2026</title>
    <link rel="stylesheet" href="event.css">
</head>
<body>
    <header>
        <div class="logo">WebDevCon '26</div>
        <nav>
            <ul>
                <li><a href="event.html">Home</a></li>
                <li><a href="event.html#about">About</a></li>
                <li><a href="event.html#speaker">Speaker</a></li>
                <li><a href="event.html#venue">Venue</a></li>
            </ul>
        </nav>
    </header>
    <section class="registration-section">
        <div class="form-container">
            <h2>Conference Registration</h2>
            <p class="form-instructions">Please fill out the form below to secure your pass for WebDevCon 2026.</p>
            <form action="event.html" method="GET">
                <div class="form-group">
                    <label for="reg-name">Full Name</label>
                    <input type="text" id="reg-name" name="name" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" name="email" placeholder="john.doe@example.com" required>
                </div>
                <div class="form-group">
                    <label for="reg-org">Organization / School</label>
                    <input type="text" id="reg-org" name="org" placeholder="Acme University">
                </div>
                <div class="form-group">
                    <label for="experience">Coding Experience Level</label>
                    <select id="experience" name="experience" required>
                        <option value="" disabled selected>Select level</option>
                        <option value="beginner">Beginner (Under 1 year)</option>
                        <option value="intermediate">Intermediate (1-3 years)</option>
                        <option value="advanced">Advanced (3+ years)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Select T-Shirt Size</label>
                    <div class="choice-list">
                        <label><input type="radio" name="tshirt" value="small" required> Small</label>
                        <label><input type="radio" name="tshirt" value="medium"> Medium</label>
                        <label><input type="radio" name="tshirt" value="large"> Large</label>
                        <label><input type="radio" name="tshirt" value="xl"> XL</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Dietary Restrictions</label>
                    <div class="choice-list">
                        <label><input type="checkbox" name="diet" value="vegetarian"> Vegetarian</label>
                        <label><input type="checkbox" name="diet" value="vegan"> Vegan</label>
                        <label><input type="checkbox" name="diet" value="gluten-free"> Gluten-Free</label>
                    </div>
                </div>
                <button type="submit" class="submit-btn">Complete Registration</button>
            </form>
        </div>
    </section>
    <footer>
        <p>&copy; 2026 WebDevCon. Organized by the Web Creators Guild.</p>
        <p><a href="event.html">Back to Home</a></p>
    </footer>
</body>
</html>
